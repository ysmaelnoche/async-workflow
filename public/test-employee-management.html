<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PFMO Employee Management Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>PFMO Employee Management Test</h1>
        
        <div class="row">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Test Service Functions</h5>
                    </div>
                    <div class="card-body">
                        <button class="btn btn-primary" onclick="testEmployees()">Test Get Employees</button>
                        <button class="btn btn-success" onclick="testSubDepartments()">Test Get Sub-Departments</button>
                        <button class="btn btn-info" onclick="testAssignment()">Test Assignment</button>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Results</h5>
                    </div>
                    <div class="card-body">
                        <div id="results" style="max-height: 400px; overflow-y: auto;">
                            <p class="text-muted">Click a test button to see results</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showResult(title, data) {
            const results = document.getElementById('results');
            results.innerHTML = `
                <h6>${title}</h6>
                <pre>${JSON.stringify(data, null, 2)}</pre>
            `;
        }

        function testEmployees() {
            fetch('/test-employee-management')
                .then(response => response.json())
                .then(data => showResult('Employee Test Results', data))
                .catch(error => showResult('Error', {error: error.message}));
        }

        function testSubDepartments() {
            showResult('Sub-Department Test', {message: 'Test not implemented yet'});
        }

        function testAssignment() {
            showResult('Assignment Test', {message: 'Test not implemented yet'});
        }
    </script>
</body>
</html>
